name: One-shot stale branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'Bl0ck154/website-image-finder-skill'
    runs-on: ubuntu-latest
    steps:
      - name: Delete reviewed stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='release-v0.2.0'
          encoded="$(python3 - "$branch" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          )"
          code="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}")"
          case "$code" in
            204|404|422) echo "$branch -> HTTP $code" ;;
            *) cat /tmp/delete.json >&2; exit 1 ;;
          esac

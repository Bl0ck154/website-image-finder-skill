name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-15-intel
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Check launcher and dependencies
        run: |
          python scripts/skill.py --version
          python scripts/skill.py check
          python scripts/skill.py review --help
          python scripts/skill.py evaluate --help
      - name: Test first-use dependency bootstrap
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        env:
          WEBSITE_IMAGE_FINDER_CACHE_DIR: ${{ runner.temp }}/image-finder-bootstrap
        run: |
          python scripts/skill.py setup
          python scripts/skill.py check
          python scripts/skill.py review --help
          python scripts/skill.py evaluate --help

